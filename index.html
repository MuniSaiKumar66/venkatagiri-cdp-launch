<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080200">
<title>శ్రీశ్రీశ్రీ పోలేరమ్మ తల్లి జాతర 2026 — Official Grand Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Noto+Serif+Telugu:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e4a838;--gold2:#fff0b0;--red:#7d0905;--bg:#050100}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fcecd2}
body{font-family:Cinzel,serif}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:
radial-gradient(ellipse 120% 80% at 50% 105%,#4a1004 0%,#1b0502 45%,#050100 100%)}
.mist{position:absolute;inset:0;z-index:2;pointer-events:none;background:
radial-gradient(ellipse at 50% 85%,rgba(255,120,30,.18),transparent 55%),
linear-gradient(180deg,rgba(0,0,0,.35),transparent 35%,rgba(0,0,0,.55))}
.torch{position:absolute;bottom:4%;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,10,.32),rgba(255,50,0,.08) 38%,transparent 70%);filter:blur(25px);z-index:1;animation:flicker 2.7s infinite alternate}
.torch.l{left:-150px}.torch.r{right:-150px;animation-delay:1.2s}
@keyframes flicker{to{transform:scale(1.08);opacity:.72}}
.crowd{position:absolute;left:0;right:0;bottom:0;height:24%;z-index:3;background:
radial-gradient(ellipse at 12% 100%,#020100 0 10%,transparent 11%),
radial-gradient(ellipse at 25% 100%,#030100 0 13%,transparent 14%),
radial-gradient(ellipse at 42% 100%,#020100 0 12%,transparent 13%),
radial-gradient(ellipse at 58% 100%,#030100 0 14%,transparent 15%),
radial-gradient(ellipse at 76% 100%,#020100 0 13%,transparent 14%),
radial-gradient(ellipse at 91% 100%,#030100 0 11%,transparent 12%),
linear-gradient(0deg,#020100 0 42%,transparent 72%);filter:blur(.4px)}
#particles{position:absolute;inset:0;z-index:4;pointer-events:none}
.frame{position:absolute;inset:14px;border:1px solid rgba(228,168,56,.35);z-index:20;pointer-events:none;box-shadow:inset 0 0 50px #000}
.frame:after{content:"";position:absolute;inset:5px;border:1px dashed rgba(245,195,85,.18)}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;transition:opacity .8s,transform .8s,filter .8s}
.hide{opacity:0!important;pointer-events:none;transform:scale(1.05);filter:blur(10px)}
.badge{padding:7px 18px;border:1px solid rgba(235,178,70,.4);border-radius:30px;background:rgba(20,5,2,.72);font-size:10px;letter-spacing:.2em;color:#fed57b;box-shadow:0 0 22px rgba(255,90,0,.18);margin-bottom:18px}
.hero{font-family:"Noto Serif Telugu",serif;font-weight:900;font-size:clamp(46px,11vw,100px);line-height:1.05;background:linear-gradient(#fff,#ffeaa7 32%,#e6a735 68%,#8f5305);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 5px 18px #000)}
.sub{font-family:"Noto Serif Telugu",serif;font-size:clamp(18px,4.5vw,32px);color:#ffd88d;margin-top:12px;text-shadow:0 2px 10px #000}
.tag{font-size:clamp(10px,2.5vw,15px);letter-spacing:.28em;color:#ffecd0;margin-top:8px}
.divider{display:flex;align-items:center;gap:12px;width:min(300px,72%);margin:22px 0 8px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.gem{width:8px;height:8px;background:#ffcf6a;transform:rotate(45deg);box-shadow:0 0 12px #ff9000}
.btn{position:relative;margin-top:34px;min-width:280px;padding:19px 42px;border:1px solid #ffcc66;border-radius:4px;background:linear-gradient(#a32207,#460901 52%,#200300);box-shadow:0 16px 38px #000,0 0 30px rgba(255,80,0,.3),inset 0 1px rgba(255,255,255,.4);color:#fff2d4;font:900 14px Cinzel;letter-spacing:.18em;cursor:pointer;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;bottom:0;left:-100%;width:60%;background:linear-gradient(90deg,transparent,rgba(255,245,210,.45),transparent);transform:skewX(-25deg);animation:shine 3.5s infinite}
@keyframes shine{40%,100%{left:140%}}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 16px 42px #000,0 0 60px rgba(255,110,0,.62)}}
.chakra{width:min(74vw,320px);aspect-ratio:1;display:grid;place-items:center;position:relative}
.ring{position:absolute;inset:4%;border:1px solid #e4a838;border-radius:50%;border-style:dashed;animation:spin 18s linear infinite}
.ring:after{content:"";position:absolute;inset:12%;border:1px solid #ff8c00;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.count{font-size:clamp(110px,30vw,210px);font-weight:900;background:linear-gradient(#fff,#ffd679 40%,#e09419 75%,#7e4300);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 5px 25px #000);animation:pop .8s}
@keyframes pop{from{transform:scale(1.5);opacity:0;filter:blur(8px)}to{transform:scale(1);opacity:1;filter:none}}
.poster{width:min(86vw,84vh,640px);aspect-ratio:1;display:grid;place-items:center}
.poster img{width:90%;height:90%;object-fit:contain;border:2px solid #f6c362;border-radius:8px;box-shadow:0 25px 60px #000,0 0 80px rgba(255,100,0,.35);opacity:0;transform:scale(.65);filter:brightness(.2) blur(10px);transition:2s}
.poster img.show{opacity:1;transform:scale(1);filter:brightness(1) blur(0)}
.fallback{width:78%;aspect-ratio:1;border-radius:50%;border:3px solid #e5a738;background:radial-gradient(circle,#300902,#080100 80%);display:grid;place-items:center;padding:25px;box-shadow:0 0 70px rgba(255,90,0,.4);position:absolute}
.fallback .hero{font-size:clamp(25px,6vw,52px)}
.audio{position:absolute;top:22px;right:22px;z-index:50;width:44px;height:44px;border-radius:50%;background:rgba(18,4,1,.75);border:1px solid #e4a838;color:#fed277;cursor:pointer}
.credit{background:rgba(20,5,2,.78);border:1px solid rgba(228,168,56,.45);padding:25px 32px;box-shadow:0 15px 35px #000}
.credit h3{font-family:"Noto Serif Telugu";font-size:clamp(19px,4vw,26px);color:#ffe9b5}.credit p{font-size:10px;letter-spacing:.15em;color:#dfbc87;margin-top:8px}
.flash{position:fixed;inset:0;background:#fff8ea;opacity:0;z-index:99;pointer-events:none}.flash.fire{animation:flash 1.5s forwards}@keyframes flash{10%{opacity:.95}100%{opacity:0}}
@media(max-height:650px){.btn{margin-top:20px;padding:14px 32px}.badge{margin-bottom:10px}.divider{margin:14px 0 5px}}

/* ===== PREMIUM CINEMATIC UPGRADE ===== */
#stage:before{content:"";position:absolute;inset:0;z-index:0;background:
radial-gradient(ellipse at 50% 20%,rgba(120,20,0,.16),transparent 48%),
radial-gradient(ellipse at 50% 100%,rgba(255,80,0,.22),transparent 58%),
linear-gradient(180deg,rgba(0,0,0,.78) 0%,rgba(10,2,0,.22) 42%,rgba(0,0,0,.78) 100%)}
.stage-vignette{position:absolute;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 180px rgba(0,0,0,.95),inset 0 -80px 120px rgba(0,0,0,.7)}
.light-beam{position:absolute;bottom:-20%;width:28%;height:120%;z-index:1;opacity:.13;filter:blur(20px);background:linear-gradient(180deg,transparent,rgba(255,170,70,.65),transparent);transform:rotate(16deg);animation:beam 7s ease-in-out infinite alternate}
.lb1{left:10%}.lb2{right:8%;transform:rotate(-18deg);animation-delay:2s}
@keyframes beam{to{opacity:.24;transform:rotate(10deg) translateX(5%)}}
.realistic-glow{position:absolute;bottom:18%;left:50%;width:70vw;height:30vh;transform:translateX(-50%);z-index:2;pointer-events:none;background:radial-gradient(ellipse,rgba(255,92,18,.16),transparent 68%);filter:blur(18px)}
#s0 .hero{text-shadow:0 4px 8px #000,0 0 45px rgba(255,125,20,.35)}
#s0:after{content:"JATHARA • BHAKTI • PARAMPARA";position:absolute;bottom:8%;font:600 9px Cinzel;letter-spacing:.5em;color:rgba(255,218,150,.42)}
.royal-line{width:min(620px,80vw);height:1px;background:linear-gradient(90deg,transparent,rgba(255,210,120,.75),transparent);margin-top:12px}
#s1 .sub{max-width:760px;text-shadow:0 3px 15px #000}
#sReveal{background:radial-gradient(circle at 50% 50%,rgba(255,170,60,.12),transparent 35%)}
.poster{filter:drop-shadow(0 0 55px rgba(255,105,10,.35))}
.poster:before{content:"";position:absolute;width:105%;height:105%;border-radius:12px;border:1px solid rgba(255,207,112,.2);box-shadow:0 0 80px rgba(255,100,0,.22);z-index:-1}
.reveal-label{position:absolute;bottom:-3%;font:600 9px Cinzel;letter-spacing:.42em;color:#e7c27c;opacity:.75}
@media(min-width:800px){.screen{padding:50px}.hero{letter-spacing:-.02em}.badge{font-size:11px}}

</head>
<body>
<div id="stage">
<button class="audio" id="audioBtn">🔊</button>
<div class="mist"></div><div class="torch l"></div><div class="torch r"></div><div class="crowd"></div>
<div class="light-beam lb1"></div><div class="light-beam lb2"></div><div class="realistic-glow"></div><div class="stage-vignette"></div>
<canvas id="particles"></canvas><div class="frame"></div><div class="flash" id="flash"></div>

<section id="s0" class="screen">
<div class="badge">🔱 శ్రీశ్రీశ్రీ పోలేరమ్మ తల్లి దీవెనలతో 🔱</div>
<h1 class="hero">వెంకటగిరి</h1><h2 class="sub">శ్రీశ్రీశ్రీ పోలేరమ్మ తల్లి జాతర 2026</h2>
<p class="tag">THE HISTORIC JATHARA CELEBRATION</p><div class="divider"><i class="gem"></i></div>

</section>

<div class="divider"><i class="gem"></i></div>
<p class="sub" style="font-size:clamp(16px,3.8vw,24px);line-height:1.8">మార్మోగుతున్న డప్పుల మోత… దివిటీల వెలుగులు…<br>భక్తి పారవశ్యంలో వెంకటగిరి నేల!</p>
</section>

<section id="s2" class="screen hide">
<div class="badge">OFFICIAL DIGITAL INAUGURATION</div><h1 class="hero" style="font-size:clamp(30px,6.8vw,64px)">మహా ఆవిష్కరణ</h1>
<p class="sub" style="font-size:clamp(15px,3.5vw,22px);line-height:1.7">అశేష భక్తజనం ఎదురుచూస్తున్న ఆ క్షణం…<br>అధికారిక CDP ఆవిష్కరణకు సిద్ధం!</p>

</section>

<section id="reveal" class="screen hide">
<div class="poster"><div class="fallback" id="fallback"><div><div class="hero">శ్రీశ్రీశ్రీ పోలేరమ్మ<br>తల్లి జాతర 2026</div><div class="divider"><i class="gem"></i></div><p class="tag">OFFICIAL COMMON DP LAUNCHED</p></div></div>
<img src="cdp-poster.jpg" id="poster" alt="Venkatagiri Poleramma Jathara 2026 CDP"><div class="reveal-label">OFFICIAL COMMON DP • VENKATAGIRI JATHARA 2026</div></div>
</section>

<section id="final" class="screen hide">
<div class="badge">INAUGURATED WITH REVERENCE</div><div class="credit"><h3>శ్రీ కురుగొండ్ల రామకృష్ణ గారు</h3><p>MEMBER OF LEGISLATIVE ASSEMBLY • VENKATAGIRI</p></div>
<button class="btn" id="replay">REPLAY CEREMONY ↺</button>
</section>
</div>

<script>
const cvs=document.getElementById('particles'),ctx=cvs.getContext('2d');let W,H;
function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight}addEventListener('resize',resize);resize();
const ps=Array.from({length:75},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.6+1,s:Math.random()*1.8+.5,o:Math.random()*.65+.25}));
(function anim(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.y-=p.s;p.x+=Math.sin(p.y*.01)*.4;if(p.y<0){p.y=H+10;p.x=Math.random()*W}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,${120+Math.random()*100},45,${p.o})`;ctx.shadowBlur=8;ctx.shadowColor="#ff6b00";ctx.fill()});requestAnimationFrame(anim)})();

let audio=null,master=null,on=true,noiseBuf=null;
function audioSetup(){
 if(audio)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 audio=new AC();
 master=audio.createGain(); master.gain.value=.42; master.connect(audio.destination);
}
function noise(duration=.35){
 const b=audio.createBuffer(1,audio.sampleRate*duration,audio.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(audio.sampleRate*.055));
 return b;
}
function drum(kind="bass"){
 if(!on)return; audioSetup(); if(!audio||!master)return; audio.resume(); const t=audio.currentTime;
 const o=audio.createOscillator(),g=audio.createGain(); o.type=kind==="bass"?"sine":"triangle";
 o.frequency.setValueAtTime(kind==="bass"?125:220,t); o.frequency.exponentialRampToValueAtTime(kind==="bass"?42:90,t+.22);
 g.gain.setValueAtTime((kind==="bass" ? .82 : .32),t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);
 if(kind!=="bass"){
  const s=audio.createBufferSource(),sg=audio.createGain(),f=audio.createBiquadFilter();
  s.buffer=noise(.09);f.type="bandpass";f.frequency.value=1800;f.Q.value=.7;sg.gain.setValueAtTime(.18,t);sg.gain.exponentialRampToValueAtTime(.001,t+.09);
  s.connect(f);f.connect(sg);sg.connect(master);s.start(t);
 }
}
function bell(){
 if(!on)return;audioSetup();if(!audio||!master)return;audio.resume();let t=audio.currentTime;
 [392,523,659,784].forEach((freq,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.045,t+i*.025);g.gain.exponentialRampToValueAtTime(.001,t+2.2);o.connect(g);g.connect(master);o.start(t+i*.025);o.stop(t+2.3)});
}
function shankh(){
 if(!on)return;audioSetup();if(!audio||!master)return;audio.resume();let o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter(),t=audio.currentTime;
 o.type="sawtooth";o.frequency.setValueAtTime(170,t);o.frequency.linearRampToValueAtTime(205,t+1.8);
 f.type="lowpass";f.frequency.value=900;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.07,t+.35);g.gain.exponentialRampToValueAtTime(.001,t+2.2);
 o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+2.3);
}
function ceremonyPulse(){
 drum("bass");setTimeout(()=>drum("snap"),140);setTimeout(()=>drum("bass"),300);setTimeout(()=>bell(),430);
}
document.getElementById('audioBtn').onclick=()=>{on=!on;document.getElementById('audioBtn').textContent=on?'🔊':'🔇';if(on){audioSetup();if(audio)audio.resume();ceremonyPulse()}};

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hide'));document.getElementById(id).classList.remove('hide')}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
document.getElementById('enter').onclick=async()=>{
 audioSetup();await audio.resume();shankh();ceremonyPulse();show('s1');
 await sleep(1000);ceremonyPulse();await sleep(2600);show('s2');bell();
};
document.getElementById('launch').onclick=async()=>{
 audioSetup();await audio.resume();shankh();show('countScreen');
 for(let n=5;n>=1;n--){document.getElementById('count').textContent=n;document.getElementById('count').style.animation='none';void document.getElementById('count').offsetWidth;document.getElementById('count').style.animation='pop .8s';drum(n%2?'bass':'snap');await sleep(900)}
 document.getElementById('flash').classList.remove('fire');void document.getElementById('flash').offsetWidth;document.getElementById('flash').classList.add('fire');
 bell();show('reveal');setTimeout(()=>{document.getElementById('poster').classList.add('show');document.getElementById('fallback').style.display='none';shankh()},500);
 await sleep(5000);show('final');
};
document.getElementById('replay').onclick=()=>{document.getElementById('poster').classList.remove('show');document.getElementById('fallback').style.display='grid';show('s0')};
document.getElementById('poster').onerror=()=>{document.getElementById('poster').style.display='none'};
</script>
</body>
</html>
